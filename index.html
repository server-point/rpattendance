<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Retaipoint Attendance System</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        /* =========================================
           RETAIPOINT ATTENDANCE SYSTEM
           COLOR THEME
           ========================================= */

        :root {
            --dark-blue: #031b4e;
            --blue: #062b73;
            --white: #ffffff;
            --yellow: #d6a600;
            --light-yellow: #ffc928;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--dark-blue);
        }

        /* =========================================
           MAIN IFRAME
           ========================================= */

        #attendanceFrame {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
            z-index: 1;
        }

        /* =========================================
           PRELOADER
           ========================================= */

        #preloader {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;

            background:
                radial-gradient(
                    circle at center,
                    #092d6d 0%,
                    #041d50 45%,
                    #020f2b 100%
                );

            display: flex;
            justify-content: center;
            align-items: center;

            transition:
                opacity 0.8s ease,
                visibility 0.8s ease;
        }

        #preloader.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* =========================================
           BACKGROUND PARTICLES
           ========================================= */

        .particles {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: var(--yellow);
            border-radius: 50%;
            opacity: 0.35;
            animation: floatParticle linear infinite;
        }

        .particle:nth-child(1) {
            left: 10%;
            animation-duration: 8s;
            animation-delay: 1s;
        }

        .particle:nth-child(2) {
            left: 20%;
            animation-duration: 12s;
        }

        .particle:nth-child(3) {
            left: 35%;
            animation-duration: 10s;
            animation-delay: 2s;
        }

        .particle:nth-child(4) {
            left: 50%;
            animation-duration: 14s;
        }

        .particle:nth-child(5) {
            left: 65%;
            animation-duration: 9s;
            animation-delay: 2s;
        }

        .particle:nth-child(6) {
            left: 80%;
            animation-duration: 11s;
        }

        .particle:nth-child(7) {
            left: 90%;
            animation-duration: 13s;
            animation-delay: 3s;
        }

        @keyframes floatParticle {

            0% {
                bottom: -10%;
                transform: translateX(0) scale(0.5);
            }

            50% {
                transform: translateX(80px) scale(1);
            }

            100% {
                bottom: 110%;
                transform: translateX(-50px) scale(0.3);
            }
        }

        /* =========================================
           CONTENT
           ========================================= */

        .loader-content {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 600px;
            text-align: center;
            color: white;
        }

        /* =========================================
           LOGO
           ========================================= */

        .logo-box {
            margin-bottom: 25px;
            animation: logoEntrance 1.2s ease;
        }

        .logo-icon {
            width: 90px;
            height: 90px;
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 3px solid var(--yellow);
            border-radius: 50%;

            color: white;
            font-size: 42px;
            font-weight: bold;

            box-shadow:
                0 0 15px rgba(214,166,0,0.4),
                0 0 40px rgba(214,166,0,0.15);

            animation: logoPulse 2s infinite;
        }

        .logo-text {
            margin-top: 15px;
            font-size: 34px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .logo-text span {
            color: var(--light-yellow);
        }

        .system-name {
            font-size: 15px;
            letter-spacing: 5px;
            color: #dfe7f5;
            margin-top: 5px;
        }

        @keyframes logoEntrance {

            from {
                opacity: 0;
                transform: translateY(-30px) scale(0.8);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes logoPulse {

            0%, 100% {
                box-shadow:
                    0 0 15px rgba(214,166,0,0.3),
                    0 0 40px rgba(214,166,0,0.1);
            }

            50% {
                box-shadow:
                    0 0 25px rgba(214,166,0,0.8),
                    0 0 60px rgba(214,166,0,0.3);
            }
        }

        /* =========================================
           SCANNER
           ========================================= */

        .scanner {
            position: relative;

            width: 150px;
            height: 150px;

            margin: 35px auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Rotating circle */

        .scanner-ring {
            position: absolute;
            inset: 0;

            border-radius: 50%;

            border: 5px solid rgba(255,255,255,0.12);

            border-top-color: var(--yellow);
            border-right-color: var(--yellow);

            animation: rotate 1.5s linear infinite;
        }

        .scanner-ring-2 {
            position: absolute;
            inset: 12px;

            border-radius: 50%;

            border: 2px dashed rgba(255,255,255,0.3);

            animation: rotateReverse 4s linear infinite;
        }

        /* Fingerprint */

        .fingerprint {
            font-size: 58px;
            color: white;

            animation:
                fingerprintPulse 1.4s ease-in-out infinite;
        }

        @keyframes rotate {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes rotateReverse {

            from {
                transform: rotate(360deg);
            }

            to {
                transform: rotate(0deg);
            }
        }

        @keyframes fingerprintPulse {

            0%, 100% {
                transform: scale(0.9);
                color: white;
                filter: drop-shadow(0 0 3px white);
            }

            50% {
                transform: scale(1.08);
                color: var(--light-yellow);
                filter: drop-shadow(0 0 12px var(--yellow));
            }
        }

        /* =========================================
           LOADING TEXT
           ========================================= */

        .loading-text {
            color: var(--light-yellow);
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        .loading-subtitle {
            color: #b9c5d9;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* =========================================
           PROGRESS BAR
           ========================================= */

        .progress-container {
            width: 100%;
            max-width: 420px;
            margin: auto;
        }

        .progress {
            height: 7px;
            background: rgba(255,255,255,0.12);
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            background: linear-gradient(
                90deg,
                var(--yellow),
                var(--light-yellow),
                white
            );

            border-radius: 20px;

            box-shadow:
                0 0 10px rgba(255,201,40,0.8);

            transition: width 0.3s ease;
        }

        .percentage {
            margin-top: 10px;
            color: #d8e0ee;
            font-size: 13px;
        }

        /* =========================================
           FEATURE ITEMS
           ========================================= */

        .features {
            display: flex;
            justify-content: center;
            gap: 35px;
            margin-top: 35px;
            flex-wrap: wrap;
        }

        .feature {
            min-width: 90px;
            color: #b9c5d9;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .feature-icon {
            color: var(--light-yellow);
            font-size: 22px;
            margin-bottom: 5px;
        }

        /* =========================================
           FOOTER
           ========================================= */

        .footer {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;

            text-align: center;

            color: rgba(255,255,255,0.45);
            font-size: 11px;
            letter-spacing: 1px;
        }

        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 576px) {

            .logo-text {
                font-size: 27px;
            }

            .system-name {
                font-size: 11px;
                letter-spacing: 3px;
            }

            .scanner {
                width: 125px;
                height: 125px;
            }

            .fingerprint {
                font-size: 48px;
            }

            .features {
                gap: 15px;
            }

            .feature {
                min-width: 75px;
            }
        }

    </style>
</head>

<body>


    <!-- =========================================
         ATTENDANCE SYSTEM WEBSITE
         CHANGE THE URL BELOW
         ========================================= -->

    <iframe
        id="attendanceFrame"
        src="https://script.google.com/macros/s/AKfycbxmJhT5iG-9RSp1JBiObaBvWFiNYHQUcLfBuccigs5UX5VbVV1Q_su9KBJuJMY2FtKHrQ/exec"
        title="Retaipoint Attendance System">
    </iframe>


    <!-- =========================================
         PRELOADER
         ========================================= -->

    <div id="preloader">

        <!-- Animated Background -->
        <div class="particles">

            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>

        </div>


        <!-- Loader Content -->

        <div class="loader-content">


            <!-- Logo -->

            <div class="logo-box">

                <div class="logo-icon">
                    R
                </div>

                <div class="logo-text">
                    RETAI<span>POINT</span>
                </div>

                <div class="system-name">
                    ATTENDANCE SYSTEM
                </div>

            </div>


            <!-- Scanner Animation -->

            <div class="scanner">

                <div class="scanner-ring"></div>

                <div class="scanner-ring-2"></div>

                <div class="fingerprint">
                    ♢
                </div>

            </div>


            <!-- Loading Information -->

            <div class="loading-text">
                LOADING<span id="dots">...</span>
            </div>

            <div class="loading-subtitle">
                Preparing your attendance system
            </div>


            <!-- Progress -->

            <div class="progress-container">

                <div class="progress">

                    <div
                        id="progressBar"
                        class="progress-bar"
                        role="progressbar">
                    </div>

                </div>

                <div class="percentage">
                    <span id="percentage">0</span>%
                </div>

            </div>


            <!-- Features -->

            <div class="features">

                <div class="feature">

                    <div class="feature-icon">
                        ✓
                    </div>

                    SECURE

                </div>


                <div class="feature">

                    <div class="feature-icon">
                        ◷
                    </div>

                    ACCURATE

                </div>


                <div class="feature">

                    <div class="feature-icon">
                        ⚡
                    </div>

                    FAST

                </div>


                <div class="feature">

                    <div class="feature-icon">
                        ★
                    </div>

                    RELIABLE

                </div>

            </div>

        </div>


        <!-- Footer -->

        <div class="footer">

            © 2026 Designed by Banya Peter. All Rights Reserved.

        </div>

    </div>



    <!-- =========================================
         JAVASCRIPT
         ========================================= -->

    <script>

        const preloader = document.getElementById("preloader");

        const progressBar = document.getElementById("progressBar");

        const percentage = document.getElementById("percentage");

        const attendanceFrame =
            document.getElementById("attendanceFrame");


        let progress = 0;

        let iframeLoaded = false;


        /*
        ==========================================
        FAKE LOADING PROGRESS
        ==========================================
        */

        const loading = setInterval(function () {

            if (progress < 90) {

                progress += Math.floor(
                    Math.random() * 5
                ) + 1;

                if (progress > 90) {
                    progress = 90;
                }

                progressBar.style.width =
                    progress + "%";

                percentage.textContent =
                    progress;

            }

        }, 250);


        /*
        ==========================================
        CHECK WHEN IFRAME LOADS
        ==========================================
        */

        attendanceFrame.addEventListener(
            "load",
            function () {

                iframeLoaded = true;

                clearInterval(loading);

                progress = 100;

                progressBar.style.width = "100%";

                percentage.textContent = "100";


                /*
                Give the user a short moment
                to see the 100% animation.
                */

                setTimeout(function () {

                    preloader.classList.add("hide");

                }, 700);

            }
        );


        /*
        ==========================================
        FALLBACK
        ==========================================

        If the website takes too long to respond,
        don't leave the user stuck forever.

        */

        setTimeout(function () {

            if (!iframeLoaded) {

                clearInterval(loading);

                progress = 100;

                progressBar.style.width = "100%";

                percentage.textContent = "100";

                setTimeout(function () {

                    preloader.classList.add("hide");

                }, 700);

            }

        }, 15000);


        /*
        ==========================================
        ANIMATED LOADING DOTS
        ==========================================
        */

        const dots = document.getElementById("dots");

        let dotCount = 0;

        setInterval(function () {

            dotCount++;

            if (dotCount > 3) {
                dotCount = 0;
            }

            dots.textContent =
                ".".repeat(dotCount);

        }, 500);

    </script>

</body>
</html>
