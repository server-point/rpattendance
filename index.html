<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retailpoint Attendance System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #preloader {
            position: fixed;
            inset: 0;
            background: #071a3d;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            z-index: 9999;
        }

        .loader {
            width: 55px;
            height: 55px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid rgb(230, 184, 0);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            margin-top: 20px;
            font-size: 18px;
            letter-spacing: 1px;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <!-- PRELOADER -->
    <div id="preloader">
        <div class="loader"></div>
        <div class="loading-text">
            Loading Retailpoint Attendance System...
        </div>
    </div>

    <script>
        window.addEventListener("load", function () {

            setTimeout(function () {

                // Change this to your actual website URL
                window.location.replace(
                    "home.html"
                );

            }, 2500); // 2.5 seconds

        });
    </script>

</body>
</html>
